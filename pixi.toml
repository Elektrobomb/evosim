[workspace]
name = "evosim"
description = "Open-ended evolution of soft-bodied grid-cell creatures"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.13.*"
numpy = ">=2.0"
numba = ">=0.61"

[tasks]
# extra arguments pass through
serve = "python server.py"
check = "python tools/check.py"
